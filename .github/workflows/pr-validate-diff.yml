name: PR Validate Diff

on:
  workflow_call:
    inputs:
      pr_type:
        required: true
        type: string

jobs:
  pr-validate-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set Up PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Dependency
        run: pnpm install

      - name: Validate Pull-Request Diff
        run: node ./scripts/pr-validate-diff
