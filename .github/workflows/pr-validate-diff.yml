name: PR Validate Diff

on:
  workflow_call:
    inputs:
      pr_type:
        required: true
        type: string

permissions:
  pull-requests: write
  issues: write

jobs:
  pr-validate-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set Up PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Dependency
        run: pnpm run install-remote

      - name: Get file diffs
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$BASE_SHA"
          git fetch origin "$HEAD_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > file-diffs.txt

      - name: Validate Pull-Request Diff
        id: val-diff
        continue-on-error: true
        env:
          PR_TYPE: ${{ inputs.pr_type }}
          FILE_DIFFS_PATH: file-diffs.txt
        run: node ./scripts/pr-validate-diff

      - name: Write Status Check Comment
        if: steps.val-diff.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          JOB_NAME: "pr-validate-diff"
          ERROR_MESSAGES: ${{ steps.val-diff.outputs.error_messages }}
        with:
          script: |
            const { default: run } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/pr-status-check-write/index.js`
            );
            await run({ github, context });
      - name: Fail Job
        if: steps.val-diff.outcome == 'failure'
        run: |
          echo "Failing job. See PR comment for details."
          exit 1
