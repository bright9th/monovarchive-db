name: PR Validate Body

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [workflow, asset, doc]

jobs:
  pr-setup:
    if: github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/pr-status-check-clearall.yml

  pr-validate-body:
    needs: pr-setup
    runs-on: ubuntu-latest
    outputs:
      pr_type: ${{ steps.val-body.outputs.pr_type }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set Up PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Dependency
        run: pnpm install

      - name: Validate Pull-Request Body
        id: val-body
        continue-on-error: true
        run: node ./scripts/pr-validate-body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

      - name: Write Status Check Comment
        if: steps.val-body.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          JOB_NAME: "pr-validate-body"
          ERROR_MESSAGES: ${{ steps.val-body.outputs.error_messages }}
        with:
          script: |
            const { default: run } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/pr-status-check-write`
            );
            await run({ github, context });
      - name: Fail Job
        if: steps.val-body.outcome == 'failure'
        run: |
          echo "Failing job. See PR comment for details.""
          exit 1

  pr-execute-diff-validator:
    needs: pr-validate-body
    uses: ./.github/workflows/pr-validate-diff.yml
    with:
      pr_type: ${{ needs.pr-validate-body.outputs.pr_type }}

  pr-media-route:
    needs: pr-validate-body
    if: needs.pr-validate-body.outputs.pr_type == 'add-media'
    uses: ./.github/workflows/pr-validate-media.yml

  pr-metadata-route:
    needs: pr-validate-body
    if: needs.pr-validate-body.outputs.pr_type == 'mod-metadata'
    uses: ./.github/workflows/pr-validate-metadata.yml

  # AUTO VERSIONING

  general-version-bump:
    needs: [pr-validate-body, pr-execute-diff-validator]
    if: needs.pr-validate-body.outputs.pr_type == 'mod-workflow' || needs.pr-validate-body.outputs.pr_type == 'mod-doc'
    uses: ./.github/workflows/bump-project-version.yml
    with:
      pr_type: ${{ needs.pr-validate-body.outputs.pr_type }}

  asset-media-version-bump:
    needs: [pr-validate-body, pr-media-route]
    if: needs.pr-validate-body.outputs.pr_type == 'add-media'
    uses: ./.github/workflows/bump-project-version.yml
    with:
      pr_type: ${{ needs.pr-validate-body.outputs.pr_type }}

  asset-metadata-version-bump:
    needs: [pr-validate-body, pr-metadata-route]
    if: needs.pr-validate-body.outputs.pr_type == 'mod-metadata'
    uses: ./.github/workflows/bump-project-version.yml
    with:
      pr_type: ${{ needs.pr-validate-body.outputs.pr_type }}
