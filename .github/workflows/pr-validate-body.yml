name: PR Validate Body

on:
  workflow_call:
    inputs:
      pr_body:
        description: Pull-request Body
        required: true
        type: string
    outputs:
      pr_type:
        description: Detected Pull-request Type
        value: ${{ jobs.pr-validate-body.outputs.pr_type }}

jobs:
  pr-validate-body:
    runs-on: ubuntu-latest
    outputs:
      pr_type: ${{ steps.val-body.outputs.pr_type }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set Up PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Dependency
        run: pnpm install

      - name: Validate Pull-Request Body
        id: val-body
        continue-on-error: true
        run: node ./scripts/pr-validate-body
        env:
          PR_BODY: ${{ inputs.pr_body }}

      - name: Write Status Check Comment
        if: steps.val-body.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          JOB_NAME: "pr-validate-body"
          ERROR_MESSAGES: ${{ steps.val-body.outputs.error_messages }}
        with:
          script: |
            const { default: run } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/pr-status-check-write/index.js`
            );
            await run({ github, context });
      - name: Fail Job
        if: steps.val-body.outcome == 'failure'
        run: |
          echo "Failing job. See PR comment for details."
          exit 1
