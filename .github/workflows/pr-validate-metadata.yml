name: PR Validate Metadata

on:
  workflow_call:

jobs:
  pr-validate-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set Up PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Dependency
        run: pnpm install

      - name: Validate Metadata
        run: node ./scripts/pr-validate-metadata

  pr-execute-assets1-manager:
    needs: pr-validate-metadata
    uses: ./.github/workflows/manage-assets1.yml
