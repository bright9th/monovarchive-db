name: Generate Index

on:
  workflow_call:

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependency
        run: pnpm install

      - name: Generate Index
        run: node ./scripts/generate-index
