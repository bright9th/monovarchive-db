name: Manage Assets0

on:
  workflow_call:

jobs:
  manage-assets0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set Up PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Dependency
        run: pnpm install

      - name: Manage Assets
        run: node ./scripts/manage-assets0

  pr-execute-index-generator:
    needs: manage-assets0
    uses: ./.github/workflows/generate-index.yml
