name: PR Status Check Clear-all

on:
  workflow_call:

permissions:
  pull-requests: write
  issues: write

jobs:
  pr-status-check-clearall:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set Up PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Dependency
        run: pnpm install

      - name: Clear Status Check Comments
        uses: actions/github-script@v7
        with:
          script: |
            const { default: run } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/pr-status-check-clearall/index.js`
            );
            await run({ github, context });
